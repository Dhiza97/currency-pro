services:
  - type: web
    name: currency-converter-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false